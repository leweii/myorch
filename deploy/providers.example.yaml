# Credentials for the gateway. Copy to deploy/secrets/providers.yaml and fill in the values:
#
#   mkdir -p deploy/secrets && cp deploy/providers.example.yaml deploy/secrets/providers.yaml
#   chmod 600 deploy/secrets/providers.yaml
#
# deploy/secrets/ is in .gitignore and .dockerignore: it is never committed and never baked into an
# image. Only the one-shot `providers` service mounts it. Each `docker compose up` loads it again:
# a missing provider is created, an existing one gets the credentials from this file.
#
# Credential keys are the environment variable names the provider profile declares (env_vars).

# Extra provider profile files, as paths inside the container. Always imported without listing:
# /app/openshell/providers/*.yaml and /knowledge/<project>/providers/*.yaml.
profiles: []

# Projects whose GitHub profile (type github-<project>, one repository only) is made here with
# `myorch project github-profile <project>` and imported.
github_profiles: []                # e.g. [blog, mdm]

providers:
  claude:                          # agent steps (claude-code harness); the name must be `claude`
    type: claude-code-oauth
    credentials:
      CLAUDE_CODE_OAUTH_TOKEN: "<from: claude setup-token>"

  # Or Claude on Google Vertex AI with a GCP service account (instead of the block above). Put the
  # service account's JSON key next to this file (deploy/secrets/, chmod 600) and set
  # MYORCH_VERTEX_PROJECT (and MYORCH_VERTEX_REGION, default global) in deploy/.env. The gateway keeps
  # the private key and mints the access tokens; sandboxes never see either. The service account
  # needs roles/aiplatform.user on that project.
  # claude:
  #   type: claude-code-vertex
  #   refresh:
  #     GCP_SA_ACCESS_TOKEN:
  #       strategy: google-service-account-jwt
  #       service_account_json: vertex-sa.json   # in deploy/secrets/: client_email and private_key are read from it

  # github-blog:                   # blog; needs blog in github_profiles
  #   type: github-blog
  #   credentials:
  #     GITHUB_TOKEN: "<token>"

  # azure-artifacts:               # mdm private Maven / npm feeds
  #   type: azure-artifacts-example-org
  #   credentials:
  #     ARTIFACT_ACCESSTOKEN: "<PAT, Packaging (Read)>"
