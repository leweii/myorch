# Postmortem: a problem got through. Find the change that brought it in, decide which layer should
# have stopped it, propose knowledge changes, and turn the change into an eval case. It changes no
# project code (fixing is development's job).
#
#   uv run myorch run flows/postmortem.yaml --project mdm -i commit=<fix or revert commit>
#   uv run myorch run flows/postmortem.yaml --project mdm -i bad=<the commit that brought it in>
#
# commit: a revert (the reverted commit is the bad one) or a fix (the lines it changes are blamed);
# bad: the bad commit itself, when known. One of the two is required. The CLI and the console fill
# `runs` with the project's development and review runs; locate keeps those that touched the change.
#
# The replays are separate eval runs (myorch/evals.py, case id = this run): reviewers there see the
# change only, never this run's workspace (the incident, the fix, the analysis).
#
# Docs: https://leweii.github.io/myorch/workflows/#ch-postmortem
flow: postmortem
role: postmortem
require_one_of: [[commit, bad]]   # the console and the CLI refuse to start without one of them
inputs:
  commit:
    type: string
    label: Fix or revert commit
    hint: A commit SHA. Give this or the next one
  bad:
    type: string
    label: Commit that introduced the problem
    hint: Its SHA, if you know it
  runs:
    type: hidden          # the project's recent runs, filled in by the CLI / console
defaults:
  commit: ""
  bad: ""
  runs: ""
image: "{{project.image}}"
model: claude-sonnet-5-5

steps:
  - id: locate
    harness: script
    profile: dev-git
    observe_runs: "{{inputs.runs}}"
    outputs:
      bad: "The commit that introduced the problem"
      fix: "The fix commit (empty when there is none)"
      kind: "revert / fix / bad: the kind of commit it was found from"
      matched: "Number of myorch runs that touched this change"
      matched_runs: "Those runs' IDs, comma-separated"
    limits: { timeout: 15m, retries: 1 }
    prompt: |
      set -euo pipefail
      python3 - <<'PY'
      import base64, collections, json, os, re, subprocess
      ws, repo_name, base = os.environ["MYORCH_WORKSPACE"], os.environ["MYORCH_PROJECT_REPO"], os.environ["MYORCH_PROJECT_BASE"]
      out = f"{ws}/docs/postmortem"
      os.makedirs(out, exist_ok=True)
      auth = "http.extraHeader=Authorization: Basic " + base64.b64encode(f"x-access-token:{os.environ['GITHUB_TOKEN']}".encode()).decode()
      full = "/tmp/full"  # outside the workspace: the full history (with the fix) stays out of the run
      subprocess.run(["git", "-c", auth, "clone", "--quiet", "--no-checkout", f"https://github.com/{repo_name}.git", full],
                     check=True, capture_output=True)
      def git(*a, check=True, where=full):
          r = subprocess.run(["git", "-c", "safe.directory=*", "-C", where, *a], capture_output=True, text=True)
          if check and r.returncode:
              raise SystemExit(f"git {' '.join(a)}: {r.stderr.strip()}")
          return r.stdout.strip() if r.returncode == 0 else ""
      def resolve(ref):
          if not ref:
              return ""
          s = git("rev-parse", "--verify", "--quiet", ref + "^" + "{commit}", check=False)
          if not s:  # not on a branch (an unmerged PR): GitHub serves any reachable commit
              subprocess.run(["git", "-c", auth, "-C", full, "fetch", "--quiet", "origin", ref], capture_output=True)
              s = git("rev-parse", "--verify", "--quiet", ref + "^" + "{commit}", check=False)
          if not s:
              raise SystemExit(f"commit {ref} is not in {repo_name}")
          return s
      def fail(msg):
          json.dump({"status": "failed", "summary": msg}, open("/sandbox/out/manifest.json", "w"), ensure_ascii=False)
          raise SystemExit(msg)

      given, bad = resolve(os.environ.get("MYORCH_INPUT_COMMIT", "").strip()), resolve(os.environ.get("MYORCH_INPUT_BAD", "").strip())
      if not given and not bad:
          fail("give one of commit (the fix or revert commit) or bad (the commit that introduced the problem)")
      blamed = collections.Counter()
      if bad:
          kind, fix = "bad", (given if given != bad else "")
      else:
          fix, msg = given, git("log", "-1", "--format=%B", given)
          m = re.search(r"This reverts commit ([0-9a-f]{7,40})", msg)
          if m:
              kind, bad = "revert", resolve(m[1])
          else:  # a fix: who wrote the lines it changes (or, for pure additions, the lines around them)
              kind, path = "fix", None
              for line in git("diff", "-U0", "--no-color", f"{given}^", given).splitlines():
                  if line.startswith("--- "):
                      path = line[6:] if line.startswith("--- a/") else None
                  h = re.match(r"@@ -(\d+)(?:,(\d+))? ", line)
                  if h and path:
                      start, count = int(h[1]), int(h[2] if h[2] is not None else 1)
                      lo, hi = (start, start + count - 1) if count else (max(1, start - 2), start + 2)
                      blame = git("blame", "--porcelain", "-L", f"{lo},{hi}", f"{given}^", "--", path, check=False)
                      for b in re.findall(r"^([0-9a-f]{40}) \d+ \d+", blame, re.M):
                          blamed[b] += 1
              if not blamed:
                  fail(f"cannot find where the lines {given[:8]} changes came from. Name the commit that introduced the problem with -i bad=<commit>")
              bad = blamed.most_common(1)[0][0]
      parents = git("rev-list", "--parents", "-n", "1", bad).split()[1:]
      if not parents:
          fail(f"{bad[:8]} is the first commit: there is no base to compare with")
      base_sha = parents[0]  # a merge commit: the whole PR against its base

      def gh(path):
          r = subprocess.run(["gh", "api", path], capture_output=True, text=True)
          try:
              return json.loads(r.stdout) if r.returncode == 0 else None
          except ValueError:
              return None
      prs = gh(f"repos/{repo_name}/commits/{bad}/pulls") or []
      pr = prs[0] if prs else {}

      def text(p):
          try:
              return open(p, encoding="utf-8").read()
          except OSError:
              return ""
      def run_pr(d):
          try:
              p = (json.load(open(f"{d}/.myorch/mandate.json")).get("request") or {}).get("pr")
          except (OSError, ValueError):
              p = None
          m = re.search(r"# PR #(\d+)", text(f"{d}/docs/pr.md")) or re.search(r"/pull/(\d+)", text(f"{d}/.myorch/steps/push-and-pr/out/manifest.json"))
          return str(p or (m[1] if m else "")) or None
      matched = []
      for run in [r.strip() for r in os.environ.get("MYORCH_INPUT_RUNS", "").split(",") if r.strip()]:
          d = f"{ws}/observed/{run}"
          # the run's own commit: on its branch, not on the base it started from (any later clone has it)
          r = lambda *a: subprocess.run(["git", "-c", "safe.directory=*", "-C", f"{d}/repo", *a], capture_output=True).returncode == 0
          has = os.path.isdir(f"{d}/repo/.git") and r("merge-base", "--is-ancestor", bad, "HEAD") \
              and not r("merge-base", "--is-ancestor", bad, f"origin/{base}")
          if has or (pr.get("number") and run_pr(d) == str(pr["number"])):
              matched.append(run)
      requirement = next((text(f"{ws}/observed/{r}/docs/requirements.md") or text(f"{ws}/observed/{r}/docs/pr.md") for r in matched), "")
      if not requirement:
          requirement = git("log", "-1", "--format=%B", bad) + (f"\n\nPR #{pr['number']}: {pr.get('title', '')}\n\n{pr.get('body') or ''}" if pr else "")

      subject = git("log", "-1", "--format=%s", bad)
      target = {"repo": repo_name, "base_ref": base, "kind": kind, "given": given, "bad_sha": bad, "bad_subject": subject,
                "base_sha": base_sha, "fix_sha": fix, "pr": pr.get("number"), "pr_title": pr.get("title"),
                "pr_merged_at": pr.get("merged_at"), "matched_runs": matched, "requirement": requirement,
                "blamed": [{"commit": c, "lines": n, "subject": git("log", "-1", "--format=%s", c)} for c, n in blamed.most_common(5)]}
      json.dump(target, open(f"{out}/target.json", "w"), ensure_ascii=False, indent=1)
      open(f"{out}/bad.diff", "w").write(git("show", "--stat", "--patch", "--format=commit %H%nAuthor: %an%nDate: %ad%n%n%B", f"{base_sha}..{bad}" if len(parents) > 1 else bad)[:300000])
      if fix:
          open(f"{out}/fix.diff", "w").write(git("show", "--stat", "--patch", fix)[:300000])
      how = {"revert": f"revert commit {given[:8]} undid it", "fix": f"most lines fix commit {given[:8]} changes came from it", "bad": "given directly"}[kind]
      json.dump({"status": "ok",
                 "summary": f"commit that introduced the problem: {bad[:8]} {subject} ({how})" + (f", PR #{pr['number']}" if pr else "")
                            + (f", {len(matched)} myorch runs touched it" if matched else ", not a change made by a myorch run"),
                 "outputs": {"bad": bad, "fix": fix, "kind": kind, "matched": len(matched), "matched_runs": ",".join(matched)}},
                open("/sandbox/out/manifest.json", "w"), ensure_ascii=False)
      PY

  # Today's reviewers on the change, before anything here is adopted: a separate eval run.
  - id: replay-before
    action: postmortem-replay
    needs: [locate]
    args: {phase: before, depth: standard}
    limits: { timeout: 5m }

  # What each layer saw at the time, from the runs that touched the change.
  - id: trace
    harness: script
    profile: dev-read
    needs: [locate]
    observe_runs: "{{steps.locate.outputs.matched_runs}}"
    limits: { timeout: 10m }
    prompt: |
      set -euo pipefail
      python3 - <<'PY'
      import glob, json, os, re
      ws = os.environ["MYORCH_WORKSPACE"]
      t = json.load(open(f"{ws}/docs/postmortem/target.json"))
      def text(p):
          try:
              return open(p, encoding="utf-8").read()
          except OSError:
              return ""
      def load(p, default):
          try:
              return json.load(open(p, encoding="utf-8"))
          except (OSError, ValueError):
              return default
      # the lines the bad change touched, per file (new side), to find findings near them
      touched, path = {}, None
      for line in text(f"{ws}/docs/postmortem/bad.diff").splitlines():
          if line.startswith("+++ "):
              path = line[6:] if line.startswith("+++ b/") else None
          h = re.match(r"@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@", line)
          if h and path:
              s, n = int(h[1]), int(h[2] if h[2] is not None else 1)
              touched.setdefault(path, []).append((s, s + max(n, 1) - 1))
      def near(f):
          locs = [(l.get("file"), l.get("line")) for l in f.get("locations") or [] if isinstance(l, dict)] or [(f.get("file"), f.get("line"))]
          return any(fl in touched and (ln is None or any(a - 10 <= int(ln) <= b + 10 for a, b in touched[fl])) for fl, ln in locs)

      runs = []
      for run in t["matched_runs"]:
          d = f"{ws}/observed/{run}"
          mandate = load(f"{d}/.myorch/mandate.json", {})
          rounds = []
          for p in sorted(glob.glob(f"{d}/docs/review/round-*/verified.json"), key=lambda p: int(re.search(r"round-(\d+)", p)[1])):
              r = int(re.search(r"round-(\d+)", p)[1])
              raw = [f for n in ("reviewer-*", "security") for q in glob.glob(f"{d}/docs/review/round-{r}/{n}.json")
                     for f in (load(q, {}).get("findings", []) if isinstance(load(q, {}), dict) else load(q, []))
                     if isinstance(f, dict)]
              ver = [f for f in load(p, []) if isinstance(f, dict)]
              rounds.append({"round": r,
                             "verified_near": [{k: f.get(k) for k in ("severity", "status", "title", "file", "line")} for f in ver if near(f)],
                             "raw_near": len([f for f in raw if near(f)]), "verified": len(ver),
                             "rebuttal": bool(text(f"{d}/docs/review/round-{r}/rebuttal.md"))})
          ci = [{"round": int(re.search(r"round-(\d+)", p)[1]), **{k: v for k, v in load(p, {}).items() if k in ("ok", "status", "failed", "summary")}}
                for p in sorted(glob.glob(f"{d}/docs/ci/round-*/result.json"))]
          runs.append({"run": run, "flow": (mandate.get("flow") or {}).get("name"), "initiator": mandate.get("initiator"),
                       "requested_at": mandate.get("requested_at"), "knowledge_version": (mandate.get("project") or {}).get("version"),
                       "knowledge": mandate.get("knowledge") or [],
                       "requirement_mentions": [f for f in touched if os.path.basename(f) in text(f"{d}/docs/requirements.md")],
                       "risk": text(f"{d}/docs/risk.md")[:1500], "review": rounds, "ci": ci,
                       "delivery": text(f"{d}/docs/delivery.md")[:1500]})
      json.dump({"touched": touched, "runs": runs}, open(f"{ws}/docs/postmortem/trace.json", "w"), ensure_ascii=False, indent=1)
      md = [f"# What each layer saw at the time\n\nChange: {t['bad_sha'][:8]} {t['bad_subject']}, {len(touched)} files.\n"]
      if not runs:
          md.append("No myorch run touched this change: it did not go through myorch's requirements, review, risk verdict or approval. Only the knowledge and CI coverage can be checked.\n")
      for r in runs:
          md.append(f"## {r['run']} ({r['flow']}, {r['initiator']}, knowledge {r['knowledge_version'] or '?'})\n")
          md.append(f"- Related files the requirements document mentions: {', '.join(r['requirement_mentions']) or 'none'}")
          for rd in r["review"]:
              near_f = "; ".join(f"{f['severity']}/{f.get('status') or '-'} {f['file']}:{f.get('line')} {f['title']}" for f in rd["verified_near"]) or "none"
              md.append(f"- review round {rd['round']}: {rd['verified']} verified; near the change {rd['raw_near']} raw reviewer findings, {len(rd['verified_near'])} after verification: {near_f}" + ("; rebutted" if rd["rebuttal"] else ""))
          md.append(f"- CI: {'; '.join(json.dumps(c, ensure_ascii=False) for c in r['ci']) or 'no record'}")
          md.append(f"- Risk verdict: see observed/{r['run']}/docs/risk.md\n")
      open(f"{ws}/docs/postmortem/trace.md", "w", encoding="utf-8").write("\n".join(md) + "\n")
      flagged = sum(len(rd["verified_near"]) for r in runs for rd in r["review"])
      json.dump({"status": "ok", "summary": f"{len(runs)} runs; {flagged} verified findings near the change" if runs else "not a change made by a myorch run, no record from the time",
                 "outputs": {"runs": len(runs), "flagged": flagged}}, open("/sandbox/out/manifest.json", "w"), ensure_ascii=False)
      PY

  - id: analyze
    harness: claude-code
    profile: dev-read
    model: claude-opus-5-5
    needs: [trace]
    observe_runs: "{{steps.locate.outputs.matched_runs}}"
    outputs:
      layer: "The earliest layer that should have stopped it: requirement / implementation / review / security / risk / ci / approval / none"
      category: "no-rule / rule-not-applied / flagged-not-handled / human-let-through / not-detectable"
      proposals: "Number of proposed knowledge changes (0 to 5)"
      expected: "Number of expected findings in the eval case"
    limits: { timeout: 30m }
    prompt: |
      You run a postmortem: a problem already got into the code. Find out why it was not stopped. Read only. Do not change anything; only write files under docs/postmortem/.
      Write everything in English.

      ## Input
      - docs/external/request.md: the initiator's description of the problem (may be missing).
      - docs/postmortem/target.json: the commit that introduced the problem, the fix commit, the PR, the myorch runs that touched it.
      - docs/postmortem/bad.diff: the change that introduced the problem. docs/postmortem/fix.diff: the fix (may be missing).
      - docs/postmortem/trace.md and trace.json: what each layer saw at the time.
      - observed/<run_id>/docs/: the requirements, implementation record, review rounds, risk verdict and CI results of the runs that touched the change.
      - project/guide/, project/security.md, project/risk-rules.yaml, project/checks.sh: this project's current knowledge and checks.

      ## Decide
      1. What the problem is: say it in one or two sentences, citing the exact files and lines in bad.diff.
      2. The earliest layer that should have stopped it (outputs.layer):
         requirement (requirement analysis should have asked), implementation (the implementation guide should have avoided it), review, security, risk (should have been judged high risk so a person looks), ci (a deterministic check), approval (the approver should have seen it), or none.
      3. Why it was not stopped (outputs.category):
         - no-rule: neither the knowledge nor the checks cover this kind of problem.
         - rule-not-applied: a relevant rule exists but was not applied this time. Say which rule and why it was not applied.
         - flagged-not-handled: a reviewer or CI pointed it out, but it was rebutted, downgraded or ignored. Cite that finding from trace.
         - human-let-through: a person saw the risk and let it through anyway.
         - not-detectable: it really could not be found in advance (for example it depends on external state). Do not use this category lightly.
         When the change was not made by a myorch run, decide which layer should have stopped it had it gone through myorch.

      ## Write these files
      - docs/postmortem/postmortem.md: the problem, the layer that should have stopped it and why, the evidence, the proposals. Short, for people.
      - docs/postmortem/proposals.json: proposed knowledge changes, at most 5, in the same format as learn:
        [{"id": 1, "title": "one sentence", "kind": "add-rule|relax-rule|fill-gap", "evidence": ["<source>"],
          "changes": [{"file": "project/guide/<file>", "edits": [{"old": "<text that occurs exactly once in the file>", "new": "<replacement>"}]}
                      or {"file": "project/guide/<file>", "append": "<markdown to append>"}]}]
        Copy old verbatim from the current file; when unsure, use append. Only files under project/guide/ can be changed. Write rules so they apply to problems of the same kind, not only to this one bug.
        Do not repeat what the knowledge already says. When nothing is worth changing, write [].
      - docs/postmortem/proposals.md: the version for people.
      - docs/postmortem/follow-ups.md: proposals that suit a deterministic check (lint, CI, tests); they need a separate development run. May be empty.
      - docs/postmortem/case.json: the findings the eval case expects reviewers to report, a JSON array:
        [{"severity": "Important", "title": "one sentence", "file": "<a file in bad.diff>", "line": <line number in the file after the change>, "evidence": "why it is a problem"}]
        Only list problems a review should find by looking at the change itself. When category is not-detectable, or only CI could find it, write [].

      outputs.proposals is the number of items in proposals.json; outputs.expected is the number of items in case.json.

  - use: lib/choose-proposals.yaml
    id: choose
    needs: [analyze]
    when: "steps.analyze.outputs.proposals > 0"
    with: {dir: docs/postmortem, what: knowledge change proposals}

  - id: apply
    action: project-apply
    needs: [choose]
    when: "steps.choose.outputs.accepted > 0"
    args: {scope: learn, proposals: docs/postmortem/proposals.json, accepted: docs/postmortem/accepted.json}
    limits: { timeout: 5m }

  # The expected findings go into the case (the person confirms it in Flows → Eval set); with adopted
  # proposals, the change is replayed again on the new knowledge.
  - id: replay-after
    action: postmortem-replay
    needs: [apply, replay-before]
    args: {phase: after, depth: standard}
    limits: { timeout: 5m }
