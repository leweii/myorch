# Eval: replay a past change and review it again, to score reviewers (myorch/evals.py).
# The case (a past run's round-1 change, with findings a person confirmed) lives in
# myorch-data/evals/cases/; `myorch eval run` starts this flow once per case and depth and writes
# docs/eval/case.json without the confirmed findings, so the reviewers never see the answers.
# The score is computed afterwards from docs/review/round-1/verified.json (myorch eval report).
#
#   uv run myorch eval collect            # candidates from the history; confirm them in the console
#   uv run myorch eval run --depth quick --depth standard
#   uv run myorch eval report
#
# Docs: https://leweii.github.io/myorch/workflows/#ch-eval
flow: eval
role: eval
inputs:
  case:
    type: string
    label: 案例
    hint: 案例 ID（流程 → 评测集）
    required: true
  depth:
    type: select
    label: 测哪种强度
    options:
      - {value: quick, label: "quick：1 个 reviewer，Haiku"}
      - {value: standard, label: "standard：2 个 reviewer，Sonnet，含安全审查"}
      - {value: deep, label: "deep：3 个 reviewer，Opus，含安全审查"}
defaults:
  depth: standard
image: "{{project.image}}"
model: claude-sonnet-5-5

presets:
  by: depth
  quick:    {reviewers: 1, security: false, review_model: claude-haiku-5-5}
  standard: {reviewers: 2, security: true,  review_model: claude-sonnet-5-5}
  deep:     {reviewers: 3, security: true,  review_model: claude-opus-5-5}

steps:
  # The change exactly as the source run reviewed it, from that run's own repository (mounted
  # read-only), with everything after it removed: later fix commits would give the answers away.
  # A postmortem case (origin git) is a commit on the project's repository: cloned from GitHub,
  # then cut the same way. (For those, observe_runs mounts the postmortem run; it is not read.)
  - id: prepare
    harness: script
    profile: dev-git
    observe_runs: "{{inputs.case}}"
    limits: { timeout: 10m }
    prompt: |
      set -euo pipefail
      python3 - <<'PY'
      import base64, json, os, subprocess
      ws = os.environ["MYORCH_WORKSPACE"]
      case = json.load(open(f"{ws}/docs/eval/case.json"))
      src, repo = f"{ws}/observed/{case.get('source_run')}/repo", f"{ws}/repo"
      def git(*a):
          return subprocess.run(["git", "-c", "safe.directory=*", "-C", repo, *a], capture_output=True, text=True, check=True).stdout
      if case.get("origin") == "git":  # from GitHub, through the project's github provider
          token = base64.b64encode(f"x-access-token:{os.environ['GITHUB_TOKEN']}".encode()).decode()
          src = f"https://github.com/{os.environ['MYORCH_PROJECT_REPO']}.git"
          clone = ["git", "-c", f"http.extraHeader=Authorization: Basic {token}", "clone", "--quiet", "--no-checkout", src, repo]
      else:
          clone = ["git", "-c", "safe.directory=*", "clone", "--quiet", "--no-checkout", "--no-hardlinks", src, repo]
      for name in os.listdir(repo) if os.path.isdir(repo) else []:  # a retry: start from an empty repo/
          subprocess.run(["rm", "-rf", f"{repo}/{name}"], check=True)
      subprocess.run(clone, check=True, capture_output=True)
      git("checkout", "--quiet", "-B", os.environ["MYORCH_BRANCH"], case["head_sha"])
      git("remote", "remove", "origin")  # first: it also drops refs/remotes/origin/*
      for ref in git("for-each-ref", "--format=%(refname)").split():
          if ref != f"refs/heads/{os.environ['MYORCH_BRANCH']}":
              git("update-ref", "-d", ref)
      git("update-ref", "refs/remotes/origin/eval-base", case["base_sha"])  # the reviewers' base
      git("reflog", "expire", "--expire=now", "--all")
      git("gc", "--quiet", "--prune=now")
      git("config", "user.name", os.environ.get("MYORCH_GIT_NAME") or "myorch")
      git("config", "user.email", os.environ.get("MYORCH_GIT_EMAIL") or "myorch@localhost")
      after = git("rev-list", "--count", "--all").strip()
      open(f"{ws}/docs/eval/requirement.md", "w").write(case.get("requirement") or "（这次改动没有需求文档。按改动本身判断。）")
      json.dump({"status": "ok",
                 "summary": ("重放提交 " if case.get("origin") == "git" else f"重放 {case.get('source_run')} 第 1 轮的改动：") + f"{case['base_sha'][:8]}..{case['head_sha'][:8]}，仓库里只剩 {after} 个提交",
                 "outputs": {"head": case["head_sha"], "base": case["base_sha"], "commits": int(after)}},
                open("/sandbox/out/manifest.json", "w"), ensure_ascii=False)
      PY

  - use: lib/review-loop.yaml
    id: review-round
    needs: [prepare]
    with:
      base: eval-base
      reviewers: "{{preset.reviewers}}"
      security: "{{preset.security}}"
      review_model: "{{preset.review_model}}"
      fix: false
      max_rounds: 1
      on_exhausted: accept
      requirement_doc: docs/eval/requirement.md
