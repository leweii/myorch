# Learn from past runs: keep what the team learned, so the next run starts with it. Sources: review
# findings and their outcomes; the questions people answered (decisions); change requests and
# rejections; failed steps and CI checks; the implementation's assumptions and deviations; why a run
# was continued on its branch (what was missed); postmortem conclusions. The user picks which
# proposals to adopt; they are written back to the project pack (guide/, checks.sh).
#
#   uv run myorch run flows/learn.yaml --project mdm
#
# Without -i runs, the CLI picks the project's finished development and review runs since its last
# learn run (at most 20) and prints them; -i runs=<id>,<id> chooses by hand (`myorch list
# --project mdm` shows what there is).
#
# The CLI / console also write docs/learn/trail.json (myorch/trail.py): what the event log knows
# about those runs (answers, change requests, rejections, failures, resumes), and
# docs/learn/takeaways-learned.json: the runs whose takeaways an earlier learn already took in
# (myorch/takeaways.py, kept in myorch-data). collect reads the takeaways from the project repository's
# base branch (myorch/<date>-<run_id>/ that development commits with each change when the project
# sets flows.development.takeaway, so only merged PRs), skips the learned ones, and takes in the oldest first within a size budget; the rest wait for the
# next learn. takeaways-learned records what was taken in, whatever was adopted. Only the project's
# guide/ and checks.sh / checks.env change (myorch-knowledge/<project>/); changes are committed to
# the myorch-knowledge git repo and the snapshot re-synced. Flow changes are only proposed.
#
# Docs: https://leweii.github.io/myorch/workflows/#ch-learn
flow: learn
role: learn
inputs:
  runs:
    type: string
    label: Runs to learn from
    hint: Optional. Comma-separated run IDs; when empty, the runs since the last learn are picked
image: "{{project.image}}"
model: claude-sonnet-5-5

steps:
  # Gathers every verified finding from the observed runs and what happened to it afterwards.
  # GitHub is only read here (whether the PR was merged or closed); no repo code is run. myorch no
  # longer comments on PRs, so outcomes come from the runs themselves (later rounds, rebuttals).
  - id: collect
    harness: script
    profile: dev-git
    observe_runs: "{{inputs.runs}}"
    outputs:
      findings: "Number of findings collected"
    limits: { timeout: 10m, retries: 1 }
    prompt: |
      set -euo pipefail
      python3 - <<'PY'
      import glob, json, os, re, subprocess
      ws, repo = os.environ["MYORCH_WORKSPACE"], os.environ["MYORCH_PROJECT_REPO"]
      runs = [r.strip() for r in os.environ["MYORCH_INPUT_RUNS"].split(",") if r.strip()]
      def load(p, default=None):
          try:
              return json.load(open(p, encoding="utf-8"))
          except (OSError, ValueError):
              return default
      def gh(path):
          res = subprocess.run(["gh", "api", path], capture_output=True, text=True)
          return json.loads(res.stdout) if res.returncode == 0 else None
      def text(p):
          try:
              return open(p, encoding="utf-8").read()
          except OSError:
              return ""

      findings, per_run = [], []
      for run in runs:
          d = f"{ws}/observed/{run}"
          flow = (re.search(r"^flow:\s*(\S+)", text(f"{d}/.myorch/flow.yaml"), re.M) or [None, "?"])[1]
          role = (re.search(r"^role:\s*(\S+)", text(f"{d}/.myorch/flow.yaml"), re.M) or [None, ""])[1] \
              or (flow if flow in ("development", "review", "postmortem") else flow.partition("-")[2])
          rounds = sorted(glob.glob(f"{d}/docs/review/round-*/verified.json"), key=lambda p: int(re.search(r"round-(\d+)", p)[1]))
          verified = [(int(re.search(r"round-(\d+)", p)[1]), load(p, []) or []) for p in rounds]
          rebuttals = " ".join(text(p) for p in glob.glob(f"{d}/docs/review/round-*/rebuttal.md"))

          # Which PR did the run touch? review runs: the reviewed PR; development runs: the PR they opened.
          pr = (load(f"{d}/.myorch/mandate.json", {}) or {}).get("request", {}).get("pr")
          if not pr:
              m = re.search(r"# PR #(\d+)", text(f"{d}/docs/pr.md")) or re.search(r"/pull/(\d+)", text(f"{d}/.myorch/steps/push-and-pr/out/manifest.json"))
              pr = m[1] if m else None
          pr_info = gh(f"repos/{repo}/pulls/{pr}") if pr else None

          for rnd, items in verified:
              for f in items:
                  if f.get("status") == "fixed":
                      continue
                  title = str(f.get("title") or "")
                  later = [x for r2, its in verified if r2 > rnd for x in its]
                  outcome = "unknown"
                  if any(x.get("status") == "fixed" and x.get("file") == f.get("file") for x in later):
                      outcome = "fixed"
                  elif title and title[:12] in rebuttals:
                      outcome = "rebutted"
                  elif role == "review" and pr_info:
                      if pr_info.get("merged"):
                          outcome = "merged_unchanged"
                      elif pr_info.get("state") == "closed":
                          outcome = "closed"
                      else:
                          outcome = "open"
                  elif f.get("severity") != "Important":
                      outcome = "not_required"       # Nit / Pre-existing: never blocks
                  findings.append({"run": run, "flow": flow, "round": rnd, "pr": pr, **{k: f.get(k) for k in ("severity", "file", "line", "title", "evidence", "class")}, "outcome": outcome})
          per_run.append({"run": run, "flow": flow, "rounds": len(verified), "pr": pr,
                          "pr_state": (pr_info or {}).get("state"), "merged": (pr_info or {}).get("merged")})

      # Everything else the runs tell: decisions, rework, failures (docs/learn/signals.json / .md).
      # Runs from before myorch went English-only wrote these headings in Chinese; still read them.
      LEGACY = {
          "Assumptions": "\u5047\u8bbe",
          "Differences from the requirements": "\u548c\u9700\u6c42\u6587\u6863\u7684\u5dee\u5f02",
          "Differences from the design": "\u548c\u8bbe\u8ba1\u7684\u5dee\u5f02",
          "Problems encountered": "\u9047\u5230\u7684\u95ee\u9898",
          "Missing knowledge": "\u7f3a\u4e86\u4ec0\u4e48\u77e5\u8bc6",
          "Suggestions for the flow or platform": "\u5bf9\u6d41\u7a0b\u6216\u5e73\u53f0\u7684\u5efa\u8bae",
      }
      def section(t, name):
          names = [name] + ([LEGACY[name]] if name in LEGACY else [])
          out, level = [], 0
          for line in t.splitlines():
              m = re.match(r"^(#+)\s+(.*)", line)
              if level and m and len(m.group(1)) <= level:
                  break
              if level:
                  out.append(line)
              elif m and any(n in m.group(2) for n in names):
                  level = len(m.group(1))
          return "\n".join(out).strip()[:2000]
      trail = {t["run"]: t for t in (load(f"{ws}/docs/learn/trail.json", []) or [])}
      signals = []
      for run in runs:
          d = f"{ws}/observed/{run}"
          impl = text(f"{d}/docs/implementation.md")
          ci_failed = []
          for p in sorted(glob.glob(f"{d}/docs/ci/round-*/result.json")):
              r = load(p, {}) or {}
              if r.get("failed"):
                  ci_failed.append({"round": int(re.search(r"round-(\d+)", p)[1]), "failed": r.get("failed")})
          sig = {"run": run, **{k: v for k, v in trail.get(run, {}).items() if k != "run"},
                 "assumptions": section(impl, "Assumptions"), "off_requirement": section(impl, "Differences from the requirements"),
                 "off_design": section(impl, "Differences from the design"), "ci_failed": ci_failed,
                 "continued_because": text(f"{d}/docs/external/request.md")[:2000] if text(f"{d}/docs/previous/RUN") else "",
                 "postmortem": text(f"{d}/docs/postmortem/postmortem.md")[:4000],
                 "postmortem_follow_ups": text(f"{d}/docs/postmortem/follow-ups.md")[:2000]}
          signals.append(sig)
      os.makedirs(f"{ws}/docs/learn", exist_ok=True)
      json.dump(signals, open(f"{ws}/docs/learn/signals.json", "w"), ensure_ascii=False, indent=1)

      # Takeaways from the repository's base branch: myorch/<YYYY-MM-DD>-<run_id>/{task,takeaway}.md, committed
      # by development with each change (flows.development.takeaway), so they are there once the PR is merged. Not the ones an earlier
      # learn took in (takeaways-learned.json, from myorch-data); oldest first, within a size budget.
      BUDGET, MAX_TAKEAWAYS = 300_000, 30  # bytes and entries per learn run; the rest roll over
      base, repo_dir = os.environ["MYORCH_PROJECT_BASE"], f"{ws}/repo"
      token = os.environ.get("GITHUB_TOKEN", "")
      auth = ["-c", "http.extraHeader=Authorization: Basic " + __import__("base64").b64encode(f"x-access-token:{token}".encode()).decode()] if token else []
      def gitr(*a, check=True):
          return subprocess.run(["git", *auth, "-C", repo_dir, *a], capture_output=True, text=True, check=check)
      takeaway_note = ""
      try:
          if not os.path.isdir(f"{repo_dir}/.git"):  # no local copy: just what is needed, no checkout
              os.makedirs(repo_dir, exist_ok=True)
              subprocess.run(["git", *auth, "clone", "-q", "--filter=blob:none", "--no-checkout", "--depth", "1", "--branch", base,
                              f"https://github.com/{repo}.git", repo_dir], capture_output=True, text=True, check=True)
          else:
              gitr("fetch", "-q", "origin", base, check=False)  # a local copy that cannot fetch still has what it had
          listing = gitr("ls-tree", "--name-only", f"origin/{base}", "myorch/").stdout.split()
      except (subprocess.CalledProcessError, OSError) as e:
          # Never the command line or git's stderr: the auth header carries the token's placeholder.
          code = getattr(e, "returncode", None)
          listing, takeaway_note = [], "cannot read the repository's myorch/" + (f" (git exit code {code})" if code is not None else f" ({type(e).__name__})")
      try:
          learned = set(json.load(open(f"{ws}/docs/learn/takeaways-learned.json", encoding="utf-8")))
      except (OSError, ValueError, TypeError):
          learned = set()
      entries = []
      for path in listing:
          m = re.match(r"^myorch/(\d{4}-\d{2}-\d{2})-([a-z0-9][a-z0-9-]{0,62})$", path)  # run ids: core/types.py ID_PATTERN
          if m and m[2] not in learned:
              entries.append((path.split("/", 1)[1], m[1], m[2]))
      entries.sort()  # the date comes first: oldest first
      picked, used, unreadable, misses = [], 0, [], 0
      for name, date, run_id in entries:
          files = {}
          for f in ("task.md", "takeaway.md"):
              r = gitr("show", f"origin/{base}:myorch/{name}/{f}", check=False)  # a blobless clone fetches here
              if r.returncode == 0:
                  files[f] = r.stdout[:60000]
          if not files.get("takeaway.md", "").strip():
              # Not read (network, a partial clone) or empty: not taken in, so not recorded as learned.
              unreadable.append(run_id)
              misses += 1
              if misses >= 3:
                  break  # reads keep failing: try again next learn
              continue
          misses = 0
          size = sum(len(v.encode()) for v in files.values())
          if picked and (used + size > BUDGET or len(picked) >= MAX_TAKEAWAYS):
              break
          used += size
          os.makedirs(f"{ws}/docs/learn/takeaways/{name}", exist_ok=True)
          for f, t in files.items():
              open(f"{ws}/docs/learn/takeaways/{name}/{f}", "w", encoding="utf-8").write(t)
          t = files.get("takeaway.md", "")
          picked.append({"run": run_id, "date": date, "dir": f"docs/learn/takeaways/{name}",
                         "problems": section(t, "Problems encountered"), "missing": section(t, "Missing knowledge"),
                         "suggestions": section(t, "Suggestions for the flow or platform")})
      left = len(entries) - len(picked) - len(unreadable)
      if unreadable:
          takeaway_note = (takeaway_note + "; " if takeaway_note else "") + f"{len(unreadable)} takeaway.md files could not be read, trying again next time"
      json.dump({"picked": picked, "left": left, "unreadable": unreadable, "note": takeaway_note},
                open(f"{ws}/docs/learn/takeaways.json", "w"), ensure_ascii=False, indent=1)
      with open(f"{ws}/docs/learn/signals.md", "w", encoding="utf-8") as out:
          out.write("# Signals from the runs (besides review findings)\n\n")
          for g in signals:
              out.write(f"## {g['run']} ({g.get('flow') or '?'}, {g.get('status') or '?'})\n\n")
              if g.get("continued_from"):
                  out.write(f"- Continued from {g['continued_from']}. Reason (this request): {g['continued_because'][:400] or '(not given)'}\n")
              for q in g.get("qa") or []:
                  out.write(f"- Question ({q['step']}): {q['question'][:300]}\n  Answer: {q['answer'][:300]}\n")
              for c in g.get("changes") or []:
                  out.write(f"- Change request ({c['by']}): {c['text'][:300]}\n")
              for r in g.get("rejected") or []:
                  out.write(f"- Approval rejected: {r['step']}, {r['by']}\n")
              for f in g.get("failures") or []:
                  out.write(f"- Step failed: {f['step']} (attempt {f.get('attempts')}): {(f.get('error') or '')[:200]}\n")
              for c in g["ci_failed"]:
                  out.write(f"- CI failed in round {c['round']}: {', '.join(map(str, c['failed']))}\n")
              for k, label in (("assumptions", "Assumptions in the implementation"), ("off_requirement", "Differences from the requirements"), ("off_design", "Differences from the design")):
                  if g[k] and g[k].strip().lower() not in ("none", "none."):
                      out.write(f"- {label}: {g[k][:400]}\n")
              if g["postmortem"]:
                  out.write(f"- Postmortem conclusion: see observed/{g['run']}/docs/postmortem/postmortem.md\n")
              out.write("\n")
          if picked:
              out.write(f"# Takeaways in the repository ({len(picked)}, full text in docs/learn/takeaways/" + (f"; {left} more left for next time" if left else "") + ")\n\n")
              for k in picked:
                  out.write(f"## {k['run']} ({k['date']}, {k['dir']})\n\n")
                  for key, label in (("problems", "Problems encountered"), ("missing", "Missing knowledge"), ("suggestions", "Suggestions for the flow or platform")):
                      if k[key] and k[key].strip().lower() not in ("none", "none."):
                          out.write(f"- {label}: {k[key][:600]}\n")
                  out.write("\n")
      json.dump({"runs": per_run, "findings": findings}, open(f"{ws}/docs/learn/findings.json", "w"), ensure_ascii=False, indent=1)
      counts = {}
      for f in findings:
          counts[f["outcome"]] = counts.get(f["outcome"], 0) + 1
      with open(f"{ws}/docs/learn/outcomes.md", "w", encoding="utf-8") as out:
          out.write(f"# Findings and outcomes ({len(runs)} runs, {len(findings)} findings)\n\n")
          out.write("| Outcome | Count |\n|---|---|\n" + "".join(f"| {k} | {v} |\n" for k, v in sorted(counts.items())))
          out.write("\n| run | flow | rounds | PR | state |\n|---|---|---|---|---|\n")
          out.write("".join(f"| {r['run']} | {r['flow']} | {r['rounds']} | {r['pr'] or '-'} | {'merged' if r['merged'] else (r['pr_state'] or '-')} |\n" for r in per_run))
      n_qa = sum(len(g.get("qa") or []) for g in signals)
      n_rework = sum(1 for g in signals if g.get("continued_from")) + sum(1 for g in signals if g["postmortem"])
      json.dump({"status": "ok", "summary": f"{len(runs)} runs, {len(findings)} findings (" + ", ".join(f"{k} {v}" for k, v in sorted(counts.items()))
                 + f"), {n_qa} questions answered by people, {n_rework} reworks or postmortems, {len(picked)} new takeaways in the repository"
                 + (f" ({left} more left for next time)" if left else "") + (f"; {takeaway_note}" if takeaway_note else ""),
                 "outputs": {"findings": len(findings), "outcomes": counts, "answers": n_qa, "rework": n_rework,
                             "takeaways": len(picked), "takeaways_left": left}},
                open("/sandbox/out/manifest.json", "w"), ensure_ascii=False)
      PY

  - id: analyze
    harness: claude-code
    profile: dev-read
    model: claude-opus-5-5
    needs: [collect]
    observe_runs: "{{inputs.runs}}"
    outputs:
      proposals: "Number of proposed knowledge changes (0 to 5)"
      follow_ups: "Number of proposals that are not applied automatically and need a separate development run"
    limits: { timeout: 20m }
    prompt: |
      You distil knowledge from past runs, so the next run knows from the start what these runs learned. Do not change anything; only write proposal files.
      Write everything in English.

      ## Input
      - docs/learn/findings.json and outcomes.md: the verified review findings of each run, and what happened to them afterwards
        (fixed / rebutted / merged_unchanged: merged without a change / not_required: does not block / open, closed, unknown).
      - docs/learn/signals.md and signals.json: signals besides review: questions people answered (decisions), change requests, rejections,
        failed steps, CI failures, assumptions and deviations in the implementation, why a run was continued on its branch (what the first run missed), postmortem conclusions.
      - docs/learn/takeaways/<date>-<run_id>/ and takeaways.json: the task info (task.md) and lessons
        (takeaway.md: problems encountered, missing knowledge, suggestions for the flow or platform) that development runs wrote themselves; they were merged into the repository with the PR. These runs are not necessarily in observed/.
        Treat them as signals and verify them like any other evidence: adopt only project knowledge that applies to later work. The same point in several runs is more credible.
        Do not adopt content that only holds for one ticket. Suggestions about the flow, platform or environment go into flow-proposals.md.
        When you cite one, write the evidence as "<run_id>: takeaway". No such directory means there are no new takeaways.
      - observed/<run_id>/docs/: each run's requirements, design, implementation record, review rounds, risk verdict and postmortem. Read them when you need details.
      - project/guide/: this project's current knowledge (maintained by myorch). This is the main thing you improve.
      - project/checks.sh, project/checks.env: the deterministic checks every run executes. project/risk-rules.yaml and project/security.md are read-only references.
      - The repository's own knowledge (see the workspace notes) is read-only. Do not repeat what it already says.

      ## Look for these kinds of knowledge; each item needs evidence (which run, which round, which finding, which answer, or which takeaway)
      1. Decisions people made (kind: record-decision): questions people answered during requirement analysis or design. Later questions of the same kind follow the answer and need not be asked again.
         Write them into project/guide/decisions.md: one item per decision, stating "situation → what to do → why (the person's words or reason) → source".
         Record only decisions that apply to later work. Do not record choices that only held this once (for example which post to change this time).
      2. Causes of rework (kind: fill-gap): why a run was continued on its branch, postmortem conclusions, an implementation that deviated from the requirements or design, assumptions the implementation had to make.
         Ask: what, written in the knowledge earlier, would have made the first attempt right? Write it into development.md, the design guides, or writing-conventions.md.
      3. Problems of the same kind that recur (kind: add-rule): at least 2 runs, or 1 run with a large impact. Write a rule to avoid during implementation, or add it to review-guide.md so reviewers spot it.
      4. Rules that are too strict or wrong (kind: relax-rule): comments that were rebutted repeatedly, or merged without a change. Relax review-guide.md.
      5. Deterministic checks (kind: add-check): recurring problems a script can decide, or CI checks that fail repeatedly.
         Change project/checks.sh (or checks.env). Follow the conventions at the top of checks.sh (input, report.md, result.json, exit code).
         Add only deterministic checks. Checks that may give false positives only warn; they must not make the checks fail. When you are not sure how to write one correctly, put it in follow-ups and do not change the script.
      6. Flow problems: the order of steps, when questions are asked, a step that always fails or is always unnecessary. These cannot be applied automatically; write them into docs/learn/flow-proposals.md.
      Do not repeat what the knowledge already says. Keep the wording short and follow the style of the existing files. At most 8 items. Without enough evidence, propose fewer, or none.

      ## Write these files
      - docs/learn/proposals.json: a JSON array, each item
        {"id": 1, "title": "one sentence", "kind": "record-decision|fill-gap|add-rule|relax-rule|add-check", "evidence": ["<run_id>: <source>", ...],
         "changes": [{"file": "project/guide/<file>", "edits": [{"old": "<text that occurs exactly once in the file>", "new": "<replacement>"}]}
                     or {"file": "project/guide/<file>", "append": "<markdown appended to the end of the file>"}]}
        Copy old verbatim from the current file; it must occur exactly once in the file. When unsure, use append.
        Only files under project/guide/ (new files are allowed, with append) and project/checks.sh, project/checks.env can be changed.
        When guide/decisions.md does not exist, the first record-decision creates it with append. It starts with "# Decisions already made" and one sentence: requirement analysis and technical design follow these for questions of the same kind and do not ask people again.
      - docs/learn/proposals.md: the version for people. Each item: number, kind, title, number of pieces of evidence, what exactly changes (a few lines at most).
      - docs/learn/follow-ups.md: proposals that change the project repository itself (lint rules, CI configuration, tests). They need a separate development run. May be empty.
      - docs/learn/flow-proposals.md: proposals for the myorch flows (kind 6). May be empty.

  - use: lib/choose-proposals.yaml
    id: choose
    needs: [analyze]
    when: "steps.analyze.outputs.proposals > 0"
    with: {dir: docs/learn, what: knowledge change proposals}

  # Host action: validates every change (managed files only, each edit matches exactly once),
  # writes all or nothing, commits to the myorch-knowledge git repo, then re-syncs the snapshot.
  - id: apply
    action: project-apply
    needs: [choose]
    when: "steps.choose.outputs.accepted > 0"
    args: {scope: learn}
    limits: { timeout: 5m }

  # Host action: record in myorch-data which runs' takeaways this learn took in (docs/learn/takeaways.json),
  # whatever was adopted, so the next learn skips them. Nothing is written to the repository.
  - id: takeaways-learned
    action: takeaways-learned
    needs: [apply]
    when: "steps.collect.outputs.takeaways > 0"
    limits: { timeout: 2m }
