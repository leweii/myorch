# Sweep: look for bugs that are already in the code, a chunk of files per run. Meant to run on a
# schedule (myorch schedule add nightly-sweep --flow sweep --project mdm --cron '0 2 * * *').
# Observe mode: it only writes a report (docs/sweep/report.md); it never changes code or starts a
# development run. What to sweep comes from the project pack (project.yaml `sweep:`: paths,
# include, exclude, chunk). State that outlives a run is in the project's shared dir sweep/:
# cursor.json (where the next chunk starts) and known.json (issues already reported).
#
#   uv run myorch run flows/sweep.yaml --project mdm
#   uv run myorch run flows/sweep.yaml --project mdm -i depth=deep
flow: sweep
role: sweep
inputs:
  depth:
    type: select
    label: 审查强度
    options:
      - {value: quick, label: "quick：1 个审查员，Haiku"}
      - {value: standard, label: "standard：2 个审查员，Sonnet"}
      - {value: deep, label: "deep：3 个审查员，Opus"}
defaults:
  depth: standard
image: "{{project.image}}"
model: claude-sonnet-5-5

presets:
  by: depth
  quick:    {auditors: 1, audit_model: claude-haiku-5-5}
  standard: {auditors: 2, audit_model: claude-sonnet-5-5}
  deep:     {auditors: 3, audit_model: claude-opus-5-5}

steps:
  - use: lib/sync-base.yaml
    id: sync

  # Next chunk of files in a fixed order (git ls-files, filtered by the pack's sweep settings).
  # Writes the list and a copy of the known issues into the workspace; the cursor moves only
  # in `record`, after the whole run went well.
  - id: pick
    harness: script
    profile: dev-read
    needs: [sync]
    shared: [sweep]
    limits: { timeout: 5m }
    prompt: |
      set -euo pipefail
      python3 - <<'PY'
      import json, os, re, subprocess
      ws = os.environ["MYORCH_WORKSPACE"]
      state = f"{ws}/shared/sweep"
      cfg = json.load(open(f"{ws}/project/project.json")).get("sweep") or {}
      def glob_re(p):
          out, i = "", 0
          while i < len(p):
              if p.startswith("**/", i): out, i = out + "(?:.*/)?", i + 3
              elif p.startswith("**", i): out, i = out + ".*", i + 2
              elif p[i] == "*": out, i = out + "[^/]*", i + 1
              elif p[i] == "?": out, i = out + "[^/]", i + 1
              else: out, i = out + re.escape(p[i]), i + 1
          return re.compile(f"^{out}$")
      inc = [glob_re(p) for p in cfg.get("include") or []]
      exc = [glob_re(p) for p in cfg.get("exclude") or []]
      paths = [p.rstrip("/") for p in cfg.get("paths") or []]
      files = subprocess.run(["git", "-C", f"{ws}/repo", "ls-files"], capture_output=True, text=True, check=True).stdout.split("\n")
      def wanted(f):
          if not f or (paths and not any(f == p or f.startswith(p + "/") for p in paths)):
              return False
          if inc and not any(r.match(f) for r in inc):
              return False
          return not any(r.match(f) for r in exc)
      files = sorted(f for f in files if wanted(f))
      chunk = int(cfg.get("chunk") or 20)
      try:
          cursor = json.load(open(f"{state}/cursor.json")).get("next", 0)
      except (OSError, ValueError):
          cursor = 0
      if not files:
          raise SystemExit("sweep: 项目包的 sweep 设置没有选中任何文件")
      start = cursor % len(files)
      pickd = (files[start:] + files[:start])[:chunk]
      os.makedirs(f"{ws}/docs/sweep", exist_ok=True)
      open(f"{ws}/docs/sweep/chunk.txt", "w").write("\n".join(pickd) + "\n")
      try:
          known = json.load(open(f"{state}/known.json"))
      except (OSError, ValueError):
          known = []
      json.dump(known, open(f"{ws}/docs/sweep/known.json", "w"), ensure_ascii=False, indent=1)
      json.dump({"status": "ok",
                 "summary": f"这次看 {len(pickd)} 个文件（全部 {len(files)} 个里的第 {start + 1} 个起），已知问题 {len(known)} 条",
                 "outputs": {"files": len(pickd), "total": len(files), "start": start, "next": (start + len(pickd)) % len(files),
                             "known": len(known)}},
                open("/sandbox/out/manifest.json", "w"), ensure_ascii=False)
      PY

  - id: audit
    harness: claude-code
    profile: dev-read
    model: "{{preset.audit_model}}"
    needs: [pick]
    fanout: "{{preset.auditors}}"
    outputs:
      findings: "本审查员的发现条数"
    limits: { timeout: 30m }
    prompt: |
      你是代码审查员，编号 {{replica}}，共 {{preset.auditors}} 个。
      这一步只读代码，不改代码。
      你的任务：在 docs/sweep/chunk.txt 列出的文件里，找出现在就存在的缺陷。这些不是新改动，是已经在主分支上的代码。

      ## 输入
      - 要看的文件：docs/sweep/chunk.txt，每行一个路径，相对于仓库根目录（当前目录就是仓库）。
      - 已经报告过的问题：docs/sweep/known.json。里面的问题不要再报告。
      - review 标准：project/guide/review-guide.md。这个文件可能不存在。
      - 这批文件以外的代码只用来理解上下文，不要报告它们的问题。

      ## 找什么
      1. 正确性：错误的逻辑、漏掉的边界情况、没有处理的错误、和文档或注释不一致的行为。
      2. 安全：注入、泄露的密钥、不安全的默认值、缺少的权限检查。
      3. 会让用户看到错误结果的问题：坏掉的链接、错误的数据、显示错误。
      4. 你的重点：1 号多看正确性和边界情况，2 号多看安全和错误处理，3 号多看文档和数据是否一致。
         其他编号没有额外重点。
      不要报告：代码风格、命名、可以写得更好但没有错的地方、缺少测试。

      ## 严重程度
      - Important：会造成错误行为、数据错误、安全问题，值得安排人修。
      - Nit：确实是问题，但影响小。
      没有把握是不是问题时，不要报告。每条发现都要能指出具体的代码和后果。

      ## 写结果
      结果写到 docs/sweep/audit-{{replica}}.json。格式是 JSON 数组：
      [{"severity": "Important", "class": "correctness", "title": "一句话说明问题",
        "locations": [{"file": "src/a/B.java", "line": 42}],
        "evidence": "为什么是问题，引用相关代码，说明后果", "detail": "补充说明，可以为空"}]
      class 取下面的一个值：correctness、security、performance、maintainability、docs。
      没有发现时，写一个空数组 []。

  - id: verify
    harness: claude-code
    profile: dev-read
    needs: [audit]
    outputs:
      new_important: "新发现的 Important 问题条数"
      new_nit: "新发现的 Nit 问题条数"
    limits: { timeout: 20m }
    prompt: |
      你是核实员。这一步只读代码，不改代码。
      你的任务：核实审查员的发现，去掉误报和已知问题，写一份给人看的日报。

      ## 输入
      - 审查员的发现：docs/sweep/audit-*.json。
      - 这次看的文件：docs/sweep/chunk.txt。
      - 已经报告过的问题：docs/sweep/known.json。

      ## 做法
      1. 每条发现都打开代码亲自核实。不成立的去掉。
      2. 几个审查员报告的同一个问题合并成一条，votes 写报告它的审查员人数。
      3. 和 known.json 里的问题是同一个问题时，去掉。
      4. 只有一个审查员报告、你核实也成立的问题，保留。

      ## 写结果
      - docs/sweep/verified.json：JSON 数组，只包含新问题。每一项：
        {"severity": "Important", "class": "correctness", "title": "一句话说明问题",
         "file": "src/a/B.java", "line": 42, "locations": [{"file": "src/a/B.java", "line": 42}],
         "evidence": "为什么是问题", "votes": 2}
      - docs/sweep/report.md：给人看的日报。
        - 没有新问题时，只写一句：「这批文件没有发现新问题。」后面附上看了哪些目录。
        - 有新问题时，第一句写数量：Important 几条，Nit 几条。然后按严重程度列出每条：位置、问题、后果、建议怎么修。
        - 不写过程，不写「一切正常」以外的客套话。
      - outputs.new_important 和 outputs.new_nit 写条数。

  # Remember what was reported and move the cursor. Only reached when the steps above succeeded,
  # so a failed run sweeps the same chunk again next time.
  - id: record
    harness: script
    profile: dev-read
    needs: [verify]
    shared: [sweep]
    limits: { timeout: 5m }
    prompt: |
      set -euo pipefail
      python3 - <<'PY'
      import hashlib, json, os, datetime
      ws = os.environ["MYORCH_WORKSPACE"]
      state = f"{ws}/shared/sweep"
      os.makedirs(state, exist_ok=True)
      try:
          found = json.load(open(f"{ws}/docs/sweep/verified.json"))
      except (OSError, ValueError):
          found = []
      try:
          known = json.load(open(f"{state}/known.json"))
      except (OSError, ValueError):
          known = []
      seen = {k["fingerprint"] for k in known}
      run = os.environ["MYORCH_RUN_ID"]
      added = 0
      for f in found if isinstance(found, list) else []:
          fp = hashlib.sha1(f"{f.get('file','')}|{f.get('title','')}".encode()).hexdigest()[:12]
          if fp in seen:
              continue
          seen.add(fp)
          known.append({"fingerprint": fp, "file": f.get("file", ""), "line": f.get("line"), "title": f.get("title", ""),
                        "severity": f.get("severity", ""), "run": run, "at": datetime.date.today().isoformat()})
          added += 1
      json.dump(known, open(f"{state}/known.json", "w"), ensure_ascii=False, indent=1)
      pick = json.load(open(f"{ws}/.myorch/steps/pick/out/manifest.json"))["outputs"]
      json.dump({"next": pick["next"], "total": pick["total"], "run": run}, open(f"{state}/cursor.json", "w"))
      json.dump({"status": "ok",
                 "summary": (f"记下 {added} 条新问题，见 docs/sweep/report.md" if added else "没有新问题")
                            + f"。下次从第 {pick['next'] + 1} 个文件开始",
                 "outputs": {"added": added, "known": len(known)}},
                open("/sandbox/out/manifest.json", "w"), ensure_ascii=False)
      PY
