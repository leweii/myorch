# Sweep: look for bugs that are already in the code, a chunk of files per run. Meant to run on a
# schedule (myorch schedule add nightly-sweep --flow sweep --project mdm --cron '0 2 * * *').
# Observe mode: it only writes a report (docs/sweep/report.md); it never changes code or starts a
# development run. What to sweep comes from the project pack (project.yaml `sweep:`: paths,
# include, exclude, chunk). State that outlives a run is in the project's shared dir sweep/:
# cursor.json (where the next chunk starts) and known.json (issues already reported).
#
#   uv run myorch run flows/sweep.yaml --project mdm
#   uv run myorch run flows/sweep.yaml --project mdm -i depth=deep
#
# Docs: https://leweii.github.io/myorch/workflows/#ch-sweep
flow: sweep
role: sweep
inputs:
  depth:
    type: select
    label: Audit depth
    options:
      - {value: quick, label: "quick: 1 auditor, Haiku"}
      - {value: standard, label: "standard: 2 auditors, Sonnet"}
      - {value: deep, label: "deep: 3 auditors, Opus"}
defaults:
  depth: standard
image: "{{project.image}}"
model: claude-sonnet-5-5

presets:
  by: depth
  quick:    {auditors: 1, audit_model: claude-haiku-5-5}
  standard: {auditors: 2, audit_model: claude-sonnet-5-5}
  deep:     {auditors: 3, audit_model: claude-opus-5-5}

steps:
  - use: lib/sync-base.yaml
    id: sync

  # Next chunk of files in a fixed order (git ls-files, filtered by the pack's sweep settings).
  # Writes the list and a copy of the known issues into the workspace; the cursor moves only
  # in `record`, after the whole run went well.
  - id: pick
    harness: script
    profile: dev-read
    needs: [sync]
    shared: [sweep]
    limits: { timeout: 5m }
    prompt: |
      set -euo pipefail
      python3 - <<'PY'
      import json, os, re, subprocess
      ws = os.environ["MYORCH_WORKSPACE"]
      state = f"{ws}/shared/sweep"
      cfg = json.load(open(f"{ws}/project/project.json")).get("sweep") or {}
      def glob_re(p):
          out, i = "", 0
          while i < len(p):
              if p.startswith("**/", i): out, i = out + "(?:.*/)?", i + 3
              elif p.startswith("**", i): out, i = out + ".*", i + 2
              elif p[i] == "*": out, i = out + "[^/]*", i + 1
              elif p[i] == "?": out, i = out + "[^/]", i + 1
              else: out, i = out + re.escape(p[i]), i + 1
          return re.compile(f"^{out}$")
      inc = [glob_re(p) for p in cfg.get("include") or []]
      exc = [glob_re(p) for p in cfg.get("exclude") or []]
      paths = [p.rstrip("/") for p in cfg.get("paths") or []]
      files = subprocess.run(["git", "-C", f"{ws}/repo", "ls-files"], capture_output=True, text=True, check=True).stdout.split("\n")
      def wanted(f):
          if not f or (paths and not any(f == p or f.startswith(p + "/") for p in paths)):
              return False
          if inc and not any(r.match(f) for r in inc):
              return False
          return not any(r.match(f) for r in exc)
      files = sorted(f for f in files if wanted(f))
      chunk = int(cfg.get("chunk") or 20)
      try:
          cursor = json.load(open(f"{state}/cursor.json")).get("next", 0)
      except (OSError, ValueError):
          cursor = 0
      if not files:
          raise SystemExit("sweep: the project pack's sweep settings select no files")
      start = cursor % len(files)
      pickd = (files[start:] + files[:start])[:chunk]
      os.makedirs(f"{ws}/docs/sweep", exist_ok=True)
      open(f"{ws}/docs/sweep/chunk.txt", "w").write("\n".join(pickd) + "\n")
      try:
          known = json.load(open(f"{state}/known.json"))
      except (OSError, ValueError):
          known = []
      json.dump(known, open(f"{ws}/docs/sweep/known.json", "w"), ensure_ascii=False, indent=1)
      json.dump({"status": "ok",
                 "summary": f"looking at {len(pickd)} files this time (from file {start + 1} of {len(files)}), {len(known)} known problems",
                 "outputs": {"files": len(pickd), "total": len(files), "start": start, "next": (start + len(pickd)) % len(files),
                             "known": len(known)}},
                open("/sandbox/out/manifest.json", "w"), ensure_ascii=False)
      PY

  - id: audit
    harness: claude-code
    profile: dev-read
    model: "{{preset.audit_model}}"
    needs: [pick]
    fanout: "{{preset.auditors}}"
    outputs:
      findings: "Number of this auditor's findings"
    limits: { timeout: 30m }
    prompt: |
      You are a code auditor, number {{replica}} of {{preset.auditors}}.
      This step only reads code; it does not change code.
      Your task: in the files listed in docs/sweep/chunk.txt, find defects that exist now. These are not new changes; the code is already on the main branch.
      Write everything in English.

      ## Input
      - The files to look at: docs/sweep/chunk.txt, one path per line, relative to the repository root (the current directory is the repository).
      - Problems already reported: docs/sweep/known.json. Do not report them again.
      - Review standard: project/guide/review-guide.md. This file may not exist.
      - Use code outside this batch of files only to understand the context. Do not report its problems.

      ## What to look for
      1. Correctness: wrong logic, missed edge cases, unhandled errors, behaviour that differs from the docs or comments.
      2. Security: injection, leaked secrets, unsafe defaults, missing permission checks.
      3. Problems that show users wrong results: broken links, wrong data, wrong display.
      4. Your focus: number 1 looks more at correctness and edge cases, number 2 at security and error handling, number 3 at whether docs and data agree.
         Other numbers have no extra focus.
      Do not report: code style, naming, things that could be written better but are not wrong, missing tests.

      ## Severity
      - Important: causes wrong behaviour, wrong data or a security problem; worth having a person fix it.
      - Nit: really a problem, but with a small impact.
      When you are not sure it is a problem, do not report it. Every finding must point to specific code and its consequence.

      ## Write the result
      Write the result to docs/sweep/audit-{{replica}}.json. The format is a JSON array:
      [{"severity": "Important", "class": "correctness", "title": "the problem in one sentence",
        "locations": [{"file": "src/a/B.java", "line": 42}],
        "evidence": "why it is a problem, citing the relevant code and stating the consequence", "detail": "more detail, may be empty"}]
      class is one of: correctness, security, performance, maintainability, docs.
      When there are no findings, write an empty array [].

  - id: verify
    harness: claude-code
    profile: dev-read
    needs: [audit]
    outputs:
      new_important: "Number of new Important problems"
      new_nit: "Number of new Nit problems"
    limits: { timeout: 20m }
    prompt: |
      You are the verifier. This step only reads code; it does not change code.
      Your task: verify the auditors' findings, remove false positives and known problems, and write a daily report for people.
      Write everything in English.

      ## Input
      - The auditors' findings: docs/sweep/audit-*.json.
      - The files looked at this time: docs/sweep/chunk.txt.
      - Problems already reported: docs/sweep/known.json.

      ## How
      1. Open the code and verify every finding yourself. Remove the ones that do not hold.
      2. Merge the same problem reported by several auditors into one item; votes is the number of auditors who reported it.
      3. Remove a problem when it is the same as one in known.json.
      4. Keep a problem that only one auditor reported when your verification confirms it.

      ## Write the result
      - docs/sweep/verified.json: a JSON array with only the new problems. Each item:
        {"severity": "Important", "class": "correctness", "title": "the problem in one sentence",
         "file": "src/a/B.java", "line": 42, "locations": [{"file": "src/a/B.java", "line": 42}],
         "evidence": "why it is a problem", "votes": 2}
      - docs/sweep/report.md: the daily report for people.
        - With no new problems, write one sentence only: "No new problems found in this batch of files." Then list which directories were looked at.
        - With new problems, the first sentence gives the count: how many Important, how many Nit. Then list each one by severity: location, problem, consequence, suggested fix.
        - Do not describe the process. No pleasantries beyond "all fine".
      - outputs.new_important and outputs.new_nit are the counts.

  # Remember what was reported and move the cursor. Only reached when the steps above succeeded,
  # so a failed run sweeps the same chunk again next time.
  - id: record
    harness: script
    profile: dev-read
    needs: [verify]
    shared: [sweep]
    limits: { timeout: 5m }
    prompt: |
      set -euo pipefail
      python3 - <<'PY'
      import hashlib, json, os, datetime
      ws = os.environ["MYORCH_WORKSPACE"]
      state = f"{ws}/shared/sweep"
      os.makedirs(state, exist_ok=True)
      try:
          found = json.load(open(f"{ws}/docs/sweep/verified.json"))
      except (OSError, ValueError):
          found = []
      try:
          known = json.load(open(f"{state}/known.json"))
      except (OSError, ValueError):
          known = []
      seen = {k["fingerprint"] for k in known}
      run = os.environ["MYORCH_RUN_ID"]
      added = 0
      for f in found if isinstance(found, list) else []:
          fp = hashlib.sha1(f"{f.get('file','')}|{f.get('title','')}".encode()).hexdigest()[:12]
          if fp in seen:
              continue
          seen.add(fp)
          known.append({"fingerprint": fp, "file": f.get("file", ""), "line": f.get("line"), "title": f.get("title", ""),
                        "severity": f.get("severity", ""), "run": run, "at": datetime.date.today().isoformat()})
          added += 1
      json.dump(known, open(f"{state}/known.json", "w"), ensure_ascii=False, indent=1)
      pick = json.load(open(f"{ws}/.myorch/steps/pick/out/manifest.json"))["outputs"]
      json.dump({"next": pick["next"], "total": pick["total"], "run": run}, open(f"{state}/cursor.json", "w"))
      json.dump({"status": "ok",
                 "summary": (f"recorded {added} new problems, see docs/sweep/report.md" if added else "no new problems")
                            + f". Next time starts at file {pick['next'] + 1}",
                 "outputs": {"added": added, "known": len(known)}},
                open("/sandbox/out/manifest.json", "w"), ensure_ascii=False)
      PY
