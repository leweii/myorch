# Ask the user which proposals to adopt (numbers, all, none) and record the answer, for a
# project-apply step that follows. Used by learn (guide/) and onboard (the whole pack).
#
#   - use: lib/choose-proposals.yaml
#     id: choose
#     needs: [analyze]
#     when: "steps.analyze.outputs.proposals > 0"
#     with: {dir: docs/learn, what: knowledge change proposals}
#
# Reads <dir>/proposals.json ([{"id", "title", "kind", "evidence"}...]) and writes
# <dir>/accepted.json ({"accepted": [ids]}).
#
# Docs: https://leweii.github.io/myorch/workflows/#fragments--choose-proposals
fragment: choose-proposals
description: Lists proposals and lets a person pick which ones to adopt

params:
  dir:  {type: string, required: true}   # the workspace directory with proposals.json
  what: {type: string, default: change proposals}  # what the question calls the proposals

item:
  harness: script
  profile: dev-read
  interaction: allowed
  outputs:
    accepted: "Number of proposals adopted"
  limits: { input_timeout: 24h }
  prompt: |
    set -euo pipefail
    python3 - <<'PY'
    import json, os, re, subprocess
    ws = os.environ["MYORCH_WORKSPACE"]
    d = f"{ws}/{{params.dir}}"
    proposals = json.load(open(f"{d}/proposals.json", encoding="utf-8"))
    ids = [int(p["id"]) for p in proposals]
    def ask(prefix=""):
        lines = [f"{p['id']}. {p['title']} ({p.get('kind', '')}, {len(p.get('evidence') or [])} pieces of evidence)" for p in proposals]
        q = (prefix + "These {{params.what}} were proposed (details in the workspace: {{params.dir}}/proposals.md). Which ones should be adopted? Reply with their numbers, such as 1,3, or all / none.\n" + "\n".join(lines))
        subprocess.run(["/sandbox/bin/myorch-ask", q, "--option", "all", "--option", "none"], check=True)
    reply = os.environ.get("MYORCH_REPLY", "").strip().lower()
    if os.environ.get("MYORCH_TURN") == "1":
        ask()
        raise SystemExit(0)
    if reply == "all":
        chosen = ids
    elif reply in ("none", "0"):
        chosen = []
    else:
        nums = [int(x) for x in re.findall(r"\d+", reply)]
        if not nums or any(n not in ids for n in nums):
            ask(f"Could not understand \"{reply}\". ")
            raise SystemExit(0)
        chosen = sorted(set(nums))
    json.dump({"accepted": chosen}, open(f"{d}/accepted.json", "w"))
    json.dump({"status": "ok", "summary": f"Adopted {len(chosen)}: {chosen}" if chosen else "None adopted",
               "outputs": {"accepted": len(chosen), "ids": chosen}},
              open("/sandbox/out/manifest.json", "w"), ensure_ascii=False)
    PY
