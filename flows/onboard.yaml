# Onboard a project: study the repository, try the pack's checks on it, and propose how to fill in
# or correct the project pack (guide/, checks.sh, setup.sh, risk-rules.yaml, security.md). The
# user picks which proposals to adopt; they are committed to myorch-knowledge and re-synced.
#
#   uv run myorch run flows/onboard.yaml --project <name>
#
# Run it once when a project is added (after `myorch project sync <name>`), and again whenever the
# repository changes shape. Nothing is pushed to the project's repository.
#
# Docs: https://leweii.github.io/myorch/workflows/#ch-onboard
flow: onboard
role: onboard
inputs:
  focus:
    type: message
    label: Focus areas
    hint: Optional, for example “frontend checks”, “database migrations”
defaults:
  focus: ""
image: "{{project.image}}"
model: claude-sonnet-5-5

steps:
  - use: lib/sync-base.yaml
    id: sync

  # Tries the pack's checks on the last commits of the base branch, to see whether they find the
  # right modules, how long they take, and what fails for reasons unrelated to any change.
  - id: try-checks
    harness: script
    profile: dev-write
    needs: [sync]
    outputs:
      passed: "Whether all checks passed"
    limits: { timeout: 60m }
    prompt: |
      set -uo pipefail
      cd "$MYORCH_WORKSPACE/repo"
      if [ -f "$MYORCH_WORKSPACE/project/setup.sh" ]; then bash "$MYORCH_WORKSPACE/project/setup.sh" || echo "setup.sh failed" > /tmp/setup-failed; fi
      export CHECKS_DIR="$MYORCH_WORKSPACE/docs/onboard/checks"
      mkdir -p "$CHECKS_DIR"
      # The last 5 commits as a sample change; a younger repository: everything (from the empty tree).
      BASE_REF=$(git rev-list --max-count=1 --skip=5 HEAD)
      [ -n "$BASE_REF" ] || BASE_REF=$(git hash-object -t tree /dev/null)
      export BASE_REF
      git diff --name-only "$BASE_REF" HEAD > "$CHECKS_DIR/changed.txt"
      start=$(date +%s)
      if [ -f "$MYORCH_WORKSPACE/project/checks.sh" ]; then
        bash "$MYORCH_WORKSPACE/project/checks.sh"; code=$?
      else
        echo "# No checks.sh" > "$CHECKS_DIR/report.md"; echo '{"passed": false, "failed": ["no checks.sh"], "skipped": []}' > "$CHECKS_DIR/result.json"; code=0
      fi
      secs=$(( $(date +%s) - start ))
      python3 - "$CHECKS_DIR" "$code" "$secs" <<'PY'
      import json, os, sys
      d, code, secs = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
      try:
          r = json.load(open(f"{d}/result.json"))
      except (OSError, ValueError):
          r = {"passed": False, "failed": [f"checks.sh did not write result.json (exit code {code})"], "skipped": []}
      n = len([l for l in open(f"{d}/changed.txt") if l.strip()])
      setup = "; setup.sh failed" if os.path.exists("/tmp/setup-failed") else ""
      summary = f"sample change of {n} files, checks {'passed' if r.get('passed') else 'failed: ' + ', '.join(map(str, r.get('failed', [])))}, took {secs}s{setup}"
      json.dump({"status": "ok", "summary": summary, "outputs": {"passed": bool(r.get("passed")), "seconds": secs, **r}},
                open("/sandbox/out/manifest.json", "w"), ensure_ascii=False)
      PY

  - id: analyze
    harness: claude-code
    profile: dev-read
    model: claude-opus-5-5
    needs: [try-checks]
    outputs:
      proposals: "Number of proposed project pack changes (0 to 8)"
    limits: { timeout: 40m }
    prompt: |
      You help myorch understand this project ({{project.repo}}). Later development, review and risk verdicts depend on your conclusions.
      Do not change the repository or the project pack; only write files under docs/onboard/. Write everything in English. {{inputs.focus}}

      Input:
      - repo/: the project code (latest {{project.base}} branch).
      - The repository's own knowledge (read-only, see the workspace notes): read it first, and do not repeat what it already says.
      - project/: myorch's current project pack (the template and the project merged). project/project.json is the configuration;
        guide/ is the knowledge myorch maintains; checks.sh and setup.sh are the check and setup scripts; risk-rules.yaml holds the approval rules;
        security.md lists the security review focus.
      - docs/onboard/checks/: the result of running checks.sh on the last 5 commits as a sample (report.md, result.json, changed.txt).

      Find out and verify:
      1. Structure: how modules are divided, their dependencies, which parts are external contracts (interfaces, protocols, database migrations), where the frontend is.
      2. Build and checks: how to build, how to test only the affected parts, which private dependencies or environment are needed; whether checks.sh finds the right
         modules, whether it misses checks, and where it fails for reasons unrelated to the change (environment, network, cache).
      3. Conventions: code style, how tests are written, commit and PR conventions, and whether they match what project/guide/ says.
      4. Risk: which paths need more approvers when changed (whether risk-rules.yaml misses some or catches too much); what needs special attention for security.

      Write four files:
      - docs/onboard/report.md: an overview of the project and your conclusions, for people. Give the source (file path) for each conclusion.
      - docs/onboard/proposals.json: a JSON array, at most 8 items, each
        {"id": 1, "title": "one sentence", "kind": "fill-gap|fix-checks|fix-rule|security", "evidence": ["<file path or check result>", ...],
         "changes": [{"file": "project/<file>", "edits": [{"old": "<text that occurs exactly once in the file>", "new": "<replacement>"}]}
                     or {"file": "project/<file>", "append": "<content appended to the end>"}
                     or {"file": "project/<file>", "content": "<the whole new content of the file>"}]}
        Only project/guide/ (new files are allowed), project/checks.sh, project/setup.sh, project/risk-rules.yaml and project/security.md can be changed.
        Changes go into the project's own files: guide/, checks.sh and setup.sh that come from the template are copied first and then changed, so edits can cite the text you see;
        risk-rules.yaml and security.md are the template and the project joined together, and the project's own part holds only what is specific to the project, so for them use only
        append (security.md) or content (risk-rules.yaml: write the complete project rules file, a `rules:` list and an optional `default:`).
        In guide/, write only what the repository's own docs do not say and what affects the agents' judgement. Keep the wording short.
      - docs/onboard/proposals.md: the version for people. Each item: number, title, source, what exactly changes.
      - docs/onboard/open-questions.md: questions a person must answer before they can be settled (may be empty).

  - use: lib/choose-proposals.yaml
    id: choose
    needs: [analyze]
    when: "steps.analyze.outputs.proposals > 0"
    with: {dir: docs/onboard, what: project pack change proposals}

  # Host action: validates every change (pack files of the onboard scope only), writes all or
  # nothing, commits to myorch-knowledge, re-syncs the snapshot.
  - id: apply
    action: project-apply
    needs: [choose]
    when: "steps.choose.outputs.accepted > 0"
    args: {scope: onboard, proposals: docs/onboard/proposals.json, accepted: docs/onboard/accepted.json}
    limits: { timeout: 5m }
