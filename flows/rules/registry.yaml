# Rules in the prompts that make up for something a model got wrong, and why each one is there.
#
# A harness encodes assumptions about what the model cannot do; they go stale when the model gets
# better, and then they only cost tokens and attention. So every such rule says where it came from,
# and can be switched off for an eval: in a prompt it sits between `[[rule:<id>/<place>]]` and
# `[[/rule]]` (core/fragment.py drops the markers, or the block when the rule is ablated). Replay the
# eval cases with and without it (`myorch run ... -i at=... --set flows.ablate=<id>`); a rule that
# no longer changes the outcome on today's models can go.
#
# id: the group; places: where it is marked (<id>/<place>; `--set flows.ablate=<id>` turns off all of
# them, `<id>/<place>` only one). Cases and gaps (#nn) are in myorch-workspace evals/dev (tasks/<case>/
# gaps.md, fix-plan.md, iterations/). Models when added: develop and fix claude-opus-5-5, reviewers
# claude-sonnet-5-5, verify claude-opus-5-5. `checked`: the last ablation and its outcome.
# tests/test_rules.py keeps this list and the markers in the flows the same.

rules:
  - id: ticket-table
    places: [develop]
    what: "The requirements document has a \"Ticket mapping\" table: each requirement in the ticket copied verbatim as one row, with the acceptance criteria covering every action in it"
    makes_up_for: The requirements document leaves out part of the ticket (the ticket asks for both places, only one is written; a rule is rewritten into the author's own definition)
    origin: {cases: [MD-18742], gap: "#26", change: "leweii/myorch#7 (b716eeb)", date: 2026-11-06}
    checked: null
  - id: ticket-check
    places: [review, verify]
    what: Reviewers check the requirements document and the mapping table against the original ticket; a ticket requirement left out or rewritten is Important; verify checks it against the original
    makes_up_for: Same as above; review did not look at the requirements document the author wrote
    origin: {cases: [MD-18742], gap: "#26", change: "leweii/myorch#6 (0603426), #7 (b716eeb)", date: 2026-11-06}
    checked: null
  - id: named-scope
    places: [develop, review, verify]
    what: "The agent cannot put modules, features or scenarios the ticket names into \"Out of scope\" on its own; it must ask a person; review reports it as Important"
    makes_up_for: The agent narrows the scope on its own without asking (BYO naming)
    origin: {cases: [MD-18713], gap: "#29", change: "leweii/myorch#19 (0beff01)", date: 2026-11-10}
    checked: null
  - id: entry-points
    places: [develop, review, verify]
    what: When adding validation or when consistency is required in several places, search back by error message and by field name and list every entry point; review looks for missed entry points, Important
    makes_up_for: Only one entry point was changed (write protection missed in one place; the name check on update not changed)
    origin: {cases: [MD-18627, MD-18713], gap: "#28", change: "leweii/myorch#19 (0beff01)", date: 2026-11-10}
    checked: null
  - id: guarded-checks
    places: [develop, review, verify]
    what: Before removing or loosening an existing check, find out why it exists from comments and git log; ask a person when what it protects no longer holds; review reports it as Important
    makes_up_for: A check was removed, and manually entered values were overwritten by an automatic calculation
    origin: {cases: [MD-18627], gap: "#32", change: "leweii/myorch#19 (0beff01)", date: 2026-11-10}
    checked: null
  - id: reuse
    places: [develop, review, verify]
    what: Look for an existing implementation of the same kind first; call it if it fits, reshape it to be shared if it does not, never copy it; review looks for missed reuse and copied branches, Important
    makes_up_for: Existing validation or calculation was rewritten, and the two paths later diverge
    origin: {cases: [MD-18784, MD-18483], gap: "#17", change: "leweii/myorch#6 (0603426)", date: 2026-11-06}
    checked: null
  - id: invariants
    places: [develop]
    what: "When reusing or changing existing code, conventions stated in comments (\"send each request only once\") are requirements too; on a conflict, follow them or ask a person; do not delete the comment"
    makes_up_for: Code changes worked around an invariant stated in a comment
    origin: {cases: [MD-18643], gap: "second round of fixes, \"keep stated conventions\"", change: "leweii/myorch#7 (b716eeb)", date: 2026-11-06}
    checked: null
  - id: contract-comments
    places: [develop, review]
    what: When an interface's behaviour changes, the design names the contract comments to update and the implementation updates them; review checks that new results follow the interface's existing way of returning results and that the comments are updated
    makes_up_for: An interface's behaviour changed but the contract comments on its definition did not, so callers did not know the new behaviour
    origin: {cases: [MD-18550], gap: "#14", change: "leweii/myorch#7 (b716eeb)", date: 2026-11-06}
    checked: null
  - id: boundary-tests
    places: [develop]
    what: The test plan lists the implied edge cases and counterexamples for each acceptance criterion (empty, zero, equal to a limit, just over it, occurring together); decision logic is asserted both ways
    makes_up_for: Tests covered only the main path and missed edge cases
    origin: {cases: [MD-18550, MD-18483, MD-18643, MD-18742], gap: "#27", change: "leweii/myorch#19 (0beff01)", date: 2026-11-10}
    checked: null
  - id: independent-first
    places: [review]
    what: Reviewers first look only at the requirements, the design and the diff to find problems independently, and read the implementation record last to check the author's claims
    makes_up_for: Reviewers followed the author's explanation and let faulty code pass
    origin: {cases: [], gap: "", change: "b0b41a4", date: 2026-11-06, note: added by design, no matching case}
    checked: null
  - id: nit-cap
    places: [verify]
    what: Keep at most 5 Nits
    makes_up_for: Too many style comments buried the blocking problems
    origin: {cases: [], gap: "", change: "705475c", date: 2026-10-31, note: in the flow since the first version, no matching case}
    checked: null

# Not prompt text, but the same kind of assumption: switch them with --set on a replay.
settings:
  - key: flows.development.reviewers
    default: 3
    what: How many reviewers run in parallel each round; verify merges and checks their findings
  - key: flows.development.max_rounds
    default: 3
    what: The maximum number of review and fix rounds
  - key: flows.development.security
    default: true
    what: A separate security reviewer each round
# Not switchable yet: develop's escalate_when (ask anyway when the agent says it decided without
# asking), the loop's reflect step, the one question before any code is written.
